<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalentHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 to-blue-200 min-h-screen font-sans">
  <!-- Navbar -->
  <nav class="flex justify-between items-center px-6 py-4 bg-blue-700 text-white shadow-md">
    <h1 class="text-2xl font-bold">TalentHub</h1>
    <div>
      <button id="login-btn"
        class="bg-white text-blue-700 px-4 py-2 rounded-md font-semibold hover:bg-blue-100 transition">Login</button>
      <button id="logout-btn"
        class="bg-red-600 px-4 py-2 rounded-md font-semibold hover:bg-red-700 transition hidden">Logout</button>
    </div>
  </nav>

  <!-- Auth Section -->
  <section id="auth-section" class="flex flex-col items-center justify-center mt-12">
    <div class="bg-white shadow-lg rounded-2xl p-8 w-96">
      <h2 class="text-2xl font-semibold text-center text-blue-700 mb-6">Join TalentHub</h2>

      <input id="email" type="email" placeholder="Email"
        class="w-full border p-3 mb-4 rounded-md focus:ring-2 focus:ring-blue-400" />
      <input id="password" type="password" placeholder="Password"
        class="w-full border p-3 mb-4 rounded-md focus:ring-2 focus:ring-blue-400" />

      <div class="flex justify-between">
        <button id="signup-btn" class="bg-blue-700 text-white px-4 py-2 rounded-md hover:bg-blue-800 transition">Sign
          Up</button>
        <button id="signin-btn" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition">Sign
          In</button>
      </div>
    </div>
  </section>

  <!-- Profile Section -->
  <section id="profile-section" class="hidden flex flex-col items-center mt-10">
    <div class="bg-white p-8 rounded-xl shadow-xl w-96">
      <h2 class="text-2xl font-semibold text-center text-blue-700 mb-6">Create Your Profile</h2>

      <input id="name" type="text" placeholder="Your Name"
        class="w-full border p-3 mb-4 rounded-md focus:ring-2 focus:ring-blue-400" />
      <input id="skill" type="text" placeholder="Your Skill (e.g., Photographer)"
        class="w-full border p-3 mb-4 rounded-md focus:ring-2 focus:ring-blue-400" />
      <textarea id="bio" placeholder="Describe your talent..."
        class="w-full border p-3 mb-4 rounded-md focus:ring-2 focus:ring-blue-400"></textarea>

      <button id="save-profile"
        class="bg-blue-700 text-white px-6 py-2 rounded-md w-full hover:bg-blue-800 transition">Save Profile</button>
    </div>
  </section>

  <!-- Browse Section -->
  <section id="browse-section" class="hidden mt-12 px-6">
    <h2 class="text-3xl font-bold text-center text-blue-800 mb-6">Discover Talents</h2>
    <div id="talent-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>
</body>

</html>
